name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Build and test need to read the source and nothing else. Stated here rather
# than left to the repository default, which a settings change could widen.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build -c Release -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test -c Release --no-build
